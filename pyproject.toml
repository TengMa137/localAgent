[project]
name = "localagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.39.1",
    "pydantic-ai-slim[fastmcp,openai]>=1.39.1",
    "pydantic-settings>=2.13.1",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.21",
    "rag-lib",
    "sounddevice>=0.5.5",
    "uvicorn[standard]>=0.38.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
rag-lib = { path = "../rag_lib", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]
